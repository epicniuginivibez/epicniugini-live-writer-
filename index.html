
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Epicniugini Live Writer</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
body{margin:0;background:#091a30;color:white;font-family:Arial;text-align:center;padding:15px}
h1{font-size:27px}
.paper{background:repeating-linear-gradient(#fffdf5 0px,#fffdf5 39px,#cbd9e8 40px);color:#172331;border-radius:12px;padding:20px;min-height:350px;text-align:left}
.paper h3{color:#34506a}
#names{margin-left:20px}
.name{height:42px;font:25px "Comic Sans MS",cursive;display:flex;align-items:center}
.name span{overflow:hidden;white-space:nowrap;animation:write 2s steps(25) forwards}
@keyframes write{from{width:0}to{width:100%}}
button{width:100%;padding:15px;margin-top:12px;border:0;border-radius:8px;background:#e8b64e;font-weight:bold;font-size:16px}
#status{font-size:14px;line-height:1.5;margin:15px}
.note{font-size:12px;color:#c5d2df}
</style>
</head>
<body>
<h1>EPICNIUGINI VIBEZ</h1>
<p>LIVE VIEWER NAME WRITER</p>
<div class="paper">
<h3>Special shout-outs</h3>
<div id="names"></div>
</div>
<button id="connect">CONNECT YOUTUBE CHANNEL</button>
<button id="start" disabled>START READING LIVE CHAT</button>
<button id="stop" disabled>STOP</button>
<div id="status">Connect your YouTube channel to begin.</div>
<p class="note">Read-only YouTube connection. Each viewer's name is written once per page session.</p>

<script>
const CLIENT_ID="657530567971-47avmm2tbri1s3q1bvtp1k7e40k1dfu8.apps.googleusercontent.com";
const SCOPE="https://www.googleapis.com/auth/youtube.readonly";
const statusBox=document.getElementById("status");
const startBtn=document.getElementById("start");
const stopBtn=document.getElementById("stop");
let token="",chat="",page="",running=false,timer;
let seen=new Set(),client;

function say(t){statusBox.textContent=t;}

document.getElementById("connect").onclick=()=>{
 if(!window.google?.accounts?.oauth2){say("Google sign-in loading. Wait a moment and try again.");return;}
 client=google.accounts.oauth2.initTokenClient({
  client_id:CLIENT_ID,
  scope:SCOPE,
  callback:r=>{
   if(r.error){say("Google sign-in failed: "+r.error);return;}
   token=r.access_token;
   startBtn.disabled=false;
   say("YouTube connected! Start your LIVE broadcast, then tap Start Reading Live Chat.");
  }
 });
 client.requestAccessToken({prompt:"consent"});
};

async function api(path,params){
 let u=new URL("https://www.googleapis.com/youtube/v3/"+path);
 Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
 let r=await fetch(u,{headers:{Authorization:"Bearer "+token}});
 let d=await r.json();
 if(!r.ok)throw Error(d.error?.message||"YouTube API error");
 return d;
}

function writeName(name,id){
 if(!name||seen.has(id||name.toLowerCase()))return;
 seen.add(id||name.toLowerCase());
 let line=document.createElement("div");
 line.className="name";
 let span=document.createElement("span");
 span.textContent=name;
 let pen=document.createElement("span");
 pen.textContent=" ✍️";
 line.append(span,pen);
 document.getElementById("names").append(line);
}


async function findChat(){
 let d=await api("liveBroadcasts",{
  part:"snippet,contentDetails,status",
  broadcastStatus:"active",
  broadcastType:"all",
  maxResults:"10"
 });
 let live=(d.items||[]).find(x=>x.snippet?.liveChatId);
 if(!live)throw Error("No active LIVE chat found. Start your YouTube LIVE broadcast with chat enabled.");
 return live.snippet.liveChatId;
}
 

async function poll(){
 if(!running)return;
 try{
  let p={liveChatId:chat,part:"snippet,authorDetails",maxResults:"200"};
  if(page)p.pageToken=page;
  let d=await api("liveChat/messages",p);
  (d.items||[]).forEach(m=>{
   if(m.snippet?.type==="textMessageEvent"){
    writeName(m.authorDetails?.displayName,m.authorDetails?.channelId);
   }
  });
  page=d.nextPageToken||page;
  say("LIVE CHAT CONNECTED. Unique viewers written: "+seen.size);
  timer=setTimeout(poll,Math.max(5000,d.pollingIntervalMillis||5000));
 }catch(e){
  running=false;
  startBtn.disabled=false;
  stopBtn.disabled=true;
  say("Chat error: "+e.message);
 }
}

startBtn.onclick=async()=>{
 startBtn.disabled=true;
 say("Looking for your active YouTube LIVE broadcast...");
 try{
  chat=await findChat();
  page="";
  running=true;
  stopBtn.disabled=false;
  poll();
 }catch(e){
  startBtn.disabled=false;
  say(e.message);
 }
};

stopBtn.onclick=()=>{
 running=false;
 clearTimeout(timer);
 stopBtn.disabled=true;
 startBtn.disabled=false;
 say("Chat reading stopped.");
};
</script>
</body>
</html>
